# Live ISO only: omit unused translations and offline man/Info manuals.
# Keep English/Korean message catalogs, the locale alias, and all runtime data.
# Paths are package-relative. Later ! rules preserve matching files/directories.
NoExtract = usr/share/locale/* !usr/share/locale/en* !usr/share/locale/ko* !usr/share/locale/locale.alias usr/share/man/* usr/share/info/*
