title   Litewin Automated Windows 11 Installer (RAM Resident)
sort-key 01
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y quiet loglevel=3 audit=0 udev.log_priority=3
