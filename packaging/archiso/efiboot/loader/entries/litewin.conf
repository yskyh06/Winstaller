title   Winstaller - Automated Windows 11 Installer
sort-key 01
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y winstaller.progress=1 rd.log=file vt.global_cursor_default=0 quiet loglevel=3 audit=0 udev.log_priority=3
