insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod ntfs
insmod iso9660
insmod search
insmod search_fs_file
insmod search_fs_uuid
insmod search_label
insmod probe
insmod chain
insmod configfile
insmod normal
insmod linux
insmod gzio
insmod xzio
insmod zstd
insmod test
insmod all_video
insmod gfxterm

set timeout_style=menu
set timeout=5
set default="winstaller-ram"

menuentry "[Live CD/USB] Winstaller - Automated Windows & Linux Installer" --class arch --class gnu-linux --class os --id 'winstaller-ram' {
    set gfxpayload=keep
    if [ -n "${ARCHISO_HINT}" ]; then
        set root="${ARCHISO_HINT}"
    fi
    if [ ! -e /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux ]; then
        search --no-floppy --label --set=root %ARCHISO_LABEL%
    fi
    if [ ! -e /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux ]; then
        search --no-floppy --file --set=root /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    fi
    echo ""
    echo "  +--------------------------------------------------------------------------+"
    echo "  |                                                                          |"
    echo "  |   * WINSTALLER (LIVE INSTALLER ENVIRONMENT)                              |"
    echo "  |                                                                          |"
    echo "  |   [ LOADING SYSTEM... PLEASE WAIT ]                                      |"
    echo "  |   Preparing installer environment (15-30 seconds)...                     |"
    echo "  |                                                                          |"
    echo "  +--------------------------------------------------------------------------+"
    echo ""
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y cow_spacesize=4G quiet loglevel=3 audit=0 udev.log_priority=3
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

# Detect installed Linux ROOT partition on internal disk (works even if grub.cfg is missing)
search --no-floppy --label --set=linux_root ROOT
if [ -n "$linux_root" ]; then
    menuentry "[Internal Disk] Boot Installed Ubuntu / Linux (Direct Boot)" --class ubuntu --class gnu-linux --class os --id 'ubuntu-direct' {
        insmod gzio
        insmod zstd
        insmod part_gpt
        insmod ext2
        insmod probe
        search --no-floppy --label --set=root ROOT
        probe --fs-uuid --set=root_uuid ($root)
        if [ -n "$root_uuid" ]; then
            set root_arg="root=UUID=${root_uuid}"
        else
            set root_arg="root=LABEL=ROOT"
        fi
        if [ -e /boot/vmlinuz ]; then
            linux /boot/vmlinuz ${root_arg} ro boot=local
            initrd /boot/initrd.img
        elif [ -e /boot/vmlinuz-generic ]; then
            linux /boot/vmlinuz-generic ${root_arg} ro boot=local
            initrd /boot/initrd.img-generic
        elif [ -e /boot/vmlinuz-linux ]; then
            linux /boot/vmlinuz-linux ${root_arg} ro
            initrd /boot/initramfs-linux.img
        fi
    }
    if [ -f ($linux_root)/boot/grub/grub.cfg ]; then
        menuentry "[Internal Disk] Boot Installed Ubuntu / Linux (GRUB Menu)" --class ubuntu --class gnu-linux --class os --id 'ubuntu-handoff' {
            insmod ext2
            insmod part_gpt
            search --no-floppy --label --set=root ROOT
            set prefix=($root)'/boot/grub'
            configfile ($root)/boot/grub/grub.cfg
        }
    fi
fi

# Detect installed Windows on internal disk
search --file --no-floppy --set=internal_esp /EFI/Litewin/boot_stage.flag
if [ -n "$internal_esp" ]; then
    if [ -f ($internal_esp)/EFI/Microsoft/Boot/bootmgfw.efi ]; then
        menuentry "[Internal Disk] Boot Installed Windows" --class windows --class os --id 'windows-handoff' {
            set root="$internal_esp"
            chainloader ($internal_esp)/EFI/Microsoft/Boot/bootmgfw.efi
            boot
        }
    fi
fi
