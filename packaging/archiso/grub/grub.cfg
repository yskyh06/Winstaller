insmod part_gpt
insmod part_msdos
insmod fat
insmod ntfs
insmod search_fs_file
insmod chain

set timeout=1
set default="winstaller-ram"

# [Phase 2.2] USB Bootloop Guard (Handoff to internal disk if installation is staged)
search --file --no-floppy --set=internal_esp /EFI/Litewin/boot_stage.flag
if [ -n "$internal_esp" ]; then
    set default="windows-handoff"
    set timeout=0
    menuentry "Boot Installed Windows (Auto-Handoff from USB)" --id 'windows-handoff' {
        chainloader ($internal_esp)/EFI/BOOT/BOOTX64.EFI
        boot
    }
fi

menuentry "Winstaller - Automated Windows Installer (High-DPI Console)" --class arch --class gnu-linux --class os --id 'winstaller-ram' {
    set gfxpayload=keep
    echo ""
    echo "  ╭──────────────────────────────────────────────────────────────────────────╮"
    echo "  │                                                                          │"
    echo "  │   ✦ WINSTALLER                                                           │"
    echo "  │                                                                          │"
    echo "  │   [ LOADING SYSTEM... PLEASE WAIT ]                                      │"
    echo "  │   Preparing installer environment...                                     │"
    echo "  │   This takes approximately 15-30 seconds.                                │"
    echo "  │                                                                          │"
    echo "  ╰──────────────────────────────────────────────────────────────────────────╯"
    echo ""
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y cow_spacesize=4G quiet loglevel=3 audit=0 udev.log_priority=3
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}
