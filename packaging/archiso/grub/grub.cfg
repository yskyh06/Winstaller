insmod part_gpt
insmod part_msdos
insmod fat
insmod ntfs
insmod search_fs_file
insmod chain

set timeout=1
set default="litewin-ram"

# [Phase 2.2] USB 재부팅 루프 방어 가드 (boot_stage.flag 감지 시 내장 디스크 체인로딩)
search --file --no-floppy --set=internal_esp /EFI/Litewin/boot_stage.flag
if [ -n "$internal_esp" ]; then
    set default="windows-handoff"
    set timeout=0
    menuentry "Boot Installed Windows (Auto-Handoff from USB)" --id 'windows-handoff' {
        chainloader ($internal_esp)/EFI/BOOT/BOOTX64.EFI
        boot
    }
fi

menuentry "Litewin Automated Installer (100% RAM Resident)" --class arch --class gnu-linux --class os --id 'litewin-ram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y quiet loglevel=3 audit=0 udev.log_priority=3
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}
