set timeout=3
set default=0

# Guard 1: Check if internal disk already finished Stage 1 and has boot_stage.flag.
# If flag exists, automatically chainload internal disk bootloader so user doesn't get stuck in USB boot loop.
search --file --no-floppy --set=internal_esp /EFI/Litewin/boot_stage.flag

if [ -n "$internal_esp" ]; then
    menuentry "Boot Installed Windows (Auto-Handoff from USB)" {
        chainloader ($internal_esp)/EFI/BOOT/BOOTX64.EFI
        boot
    }
fi

menuentry "Litewin - Automated Zero-Touch Windows 11 RAM Deployer" {
    linux /boot/vmlinuz quiet loglevel=3 litewin.autostart=1
    initrd /boot/initrd.img
}

menuentry "Litewin (Debug / Safe Mode)" {
    linux /boot/vmlinuz loglevel=7
    initrd /boot/initrd.img
}
